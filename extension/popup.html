<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --text: #1a1d23; --muted: #6b7280; --line: #e3e5ea; --accent: #2563eb; --down: #15803d; --up: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1e25; --text: #e8eaee; --muted: #9299a6; --line: #2c313b; --accent: #6ea0ff; --down: #4ade80; --up: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; width: 340px; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0; flex: 1; }
  header { display: flex; align-items: center; margin-bottom: 12px; }
  button, input { font: inherit; color: inherit; }
  input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); margin-top: 3px; }
  button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; }
  button.link { border: 0; padding: 0; color: var(--muted); }
  button:disabled { opacity: .6; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 9px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .name { font-weight: 600; margin-bottom: 2px; }
  .price { font-size: 22px; font-weight: 700; }
  .source { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .source span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source b { font-variant-numeric: tabular-nums; }
  .here { color: var(--accent); }
  .error { color: var(--up); margin: 8px 0; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header><h1>Price Tracker</h1><button class="link" id="open-settings">Settings</button></header>

  <section id="main">
    <div id="status" class="muted">Checking…</div>
    <div id="product" hidden>
      <div class="name" id="name"></div>
      <div class="price" id="price"></div>
      <div class="muted" id="range"></div>
      <div id="sources" style="margin-top:10px"></div>
      <div class="row"><button id="check">Check now</button><button id="open">Open tracker</button></div>
    </div>
    <button class="primary" id="track" hidden>Track this product</button>
    <div class="error" id="error" hidden></div>
  </section>

  <form id="settings" hidden>
    <label>Price Tracker address <input id="server" placeholder="http://localhost:8080" required></label>
    <label>Username (only if you set a login) <input id="username" autocomplete="off"></label>
    <label>Password <input id="password" type="password" autocomplete="off"></label>
    <button class="primary">Save</button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
